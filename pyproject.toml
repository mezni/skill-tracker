[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-tracker"
version = "1.0.0"
description = "Personal learning and project tracker with a DDD-oriented FastAPI + SQLite backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
skill-tracker = "skill_tracker.presentation.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skill_tracker.infrastructure" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
